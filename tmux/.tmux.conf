##### Terminal and server behavior #####

# Advertise tmux's terminal capabilities to applications running inside it.
set -g default-terminal "tmux-256color"

# Preserve modified keys so terminal applications can distinguish Shift-Enter.
set -g extended-keys on
set -g extended-keys-format csi-u

# Remove the Escape-key delay for modal editors.
set -s escape-time 0

# Keep 50,000 lines of scrollback per pane.
set -g history-limit 50000

# Display tmux messages for four seconds.
set -g display-time 4000

# Advertise true-color support without appending duplicates on every reload.
set -s terminal-features[100] 'xterm-256color:RGB'

# Forward terminal focus-in and focus-out events to applications inside tmux.
set -g focus-events on

# Enable mouse actions such as selecting panes, resizing splits, and scrolling.
set -g mouse on

##### Key bindings #####

# Use Ctrl-a as the prefix and Ctrl-a Ctrl-a to send it through.
unbind C-b
set -g prefix C-a
bind-key C-a send-prefix

# Open new panes and windows in the current pane's directory.
unbind %
bind-key '\' split-window -h -c '#{pane_current_path}'

unbind '"'
bind-key - split-window -v -c '#{pane_current_path}'

# Resize panes in repeat mode and toggle pane zoom with m.
bind-key -r j resize-pane -D 5
bind-key -r k resize-pane -U 5
bind-key -r h resize-pane -L 5
bind-key -r l resize-pane -R 5
bind-key m resize-pane -Z

# Use vi keys in copy mode.
set -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

bind-key r source-file ~/.tmux.conf
bind-key c new-window -c '#{pane_current_path}'

##### Windows and panes #####

# Number windows and panes from one, then close gaps after window removal.
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

##### Plugins #####

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Prefix Ctrl-s saves a session; prefix Ctrl-r restores it.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'xamut/tmux-weather'

##### Status bar #####

# Configure Catppuccin before loading its generated formats.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "basic"
set -g @catppuccin_status_background "none"
set -g @catppuccin_date_time_text " %A, %d %B %Y %H:%M %z"

set -g @catppuccin_window_current_text_color "#{@thm_mantle}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"

set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number_color "#{@thm_lavender}"

# Load the theme before expanding its colors and status modules below.
run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g window-status-separator ""
set -g status-left "#[bg=#{@thm_green},fg=#{@thm_crust}]#[reverse]█#[noreverse]#S "
set -g status-left-length 40

set -g status-interval 15
set -g status-right-length 140

# Replace status-right first so reloading this file never duplicates modules.
set -gF status-right "#{E:@catppuccin_status_weather}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#[fg=#{@thm_green}]#[fg=#{@thm_crust},bg=#{@thm_green}]󰘛 "
# Do not use -F here: the command must run on each status refresh, not at reload.
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] #(memory_pressure | awk '/System-wide memory free percentage/ {print 100 - $5}')%%"
set -agF status-right "#[fg=#{@thm_surface_0}] "
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Allow applications to pass image-protocol escape sequences to the terminal.
set -g allow-passthrough on

# Initialize TPM after all plugin declarations and status modules.
run '~/.tmux/plugins/tpm/tpm'
