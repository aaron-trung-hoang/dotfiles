name: Verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verification dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh shellcheck stow

      - name: Run verification script
        run: ./scripts/verify.sh
